name: AuthBand Band
on:
  push:
    paths: &band-paths
      - 'apps/band/**'
      - 'scripts/test-band.mjs'
      - 'scripts/release-policy.mjs'
      - 'scripts/source-state.mjs'
      - 'scripts/notices.mjs'
      - 'tests/**'
      - 'test-vectors/**'
      - 'package*.json'
      - '.node-version'
      - '.github/workflows/checks.yml'
  pull_request:
    paths: *band-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: band-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  band:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/band/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/band
      - run: npm run test:band
      - run: node --test tests/release.test.mjs
      - run: npm run build:band -- --profile capability
      - run: node --test tests/rpk-page.test.mjs tests/rpk-archive.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: authband-capability
          path: |
            artifacts/AuthBand-capability.rpk
            artifacts/AuthBand-capability.rpk.json
          if-no-files-found: error
